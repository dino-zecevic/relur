# Builds the app on a version tag (v1.2.3) and publishes it as a GitHub
# Release: a .zip and a .dmg for Apple Silicon and for Intel Macs, an AppImage
# and a .deb for x64 and arm64 Linux, and one SHA256SUMS for all of them,
# which install.sh checks. Names come from src/shared/brand.ts; the notes are
# the tag's section of CHANGELOG.md.
#
# Nothing runs until a tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Use the tag as the app's version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Check
        run: npm run check

      - name: Build and package (arm64 and x64)
        run: |
          npm run build
          npx tsx --tsconfig tsconfig.node.json scripts/package.ts --platform mac --arch all

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/*-mac-*.zip
            dist/*-mac-*.dmg
          if-no-files-found: error

  # node-pty is compiled for the machine it's built on, so each architecture
  # builds on its own runner, in Debian 11 for an old enough glibc (spec §15.6).
  linux:
    strategy:
      # Each architecture's result counts on its own: one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the AppImage and .deb
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/linux-package.sh

      # Ubuntu 24.04 lets only programs with an AppArmor profile use user
      # namespaces, which Chromium's sandbox needs, and the check's container
      # shares this runner's kernel. Set the runner up as a user does after
      # install.sh's notes, and prove the profile works (spec §15.4).
      - name: Follow install.sh's AppArmor notes, as a user does
        timeout-minutes: 10
        run: scripts/linux-package-check-host.sh

      - name: Try them on Ubuntu 24.04 (install.sh, self-test, sandbox, .deb)
        timeout-minutes: 30
        run: SKIP_BUILD=1 scripts/linux-package-check.sh

      # The .deb as a user gets it: on the runner itself, where its
      # after-install script can load its AppArmor profile (a container can't).
      - name: Try the .deb on the runner (apt, self-test with the sandbox, remove)
        timeout-minutes: 15
        run: scripts/linux-package-check-deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*-linux-*.AppImage
            dist/*-linux-*.deb
          if-no-files-found: error

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The tag's section of CHANGELOG.md; the release fails without one.
      - name: Release notes
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            assets/*

      # The landing page reads the latest version when it's built.
      - name: Rebuild the landing page
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No LANDING_DEPLOY_HOOK secret: skipped"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null
